# DECICAT worker. Deploy:  npx wrangler deploy   (from this folder, after `node ../build.mjs`)
name = "decicat"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
# custom domain (attached via the API; keep it here so deploys never detach it). workers.dev stays on too.
routes = [ { pattern = "decicat.bitcade.xyz", custom_domain = true } ]

# legacy KV (v1/v2 scores) - only read once by the Durable Object to import old entries
[[kv_namespaces]]
binding = "SCORES"
id = "7837c3c73a4e41549c6b07a6ecbc450d"

# all scores: one SQLite-backed Durable Object instance
[[durable_objects.bindings]]
name = "LB"
class_name = "Leaderboard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Leaderboard"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true
